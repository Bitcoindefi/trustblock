name: Smoke test

# Corre después de cada deploy de producción en Vercel, una vez por día y a mano.
on:
  deployment_status:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/smoke.mjs
